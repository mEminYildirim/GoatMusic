name: Goat Music APK Builder

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded ZIP and Fix Line 93
        run: |
          find . -maxdepth 2 -name "*.zip" | while read -r zfile; do
            unzip -o "$zfile"
          done
          if [ ! -f "settings.gradle.kts" ]; then
            find . -maxdepth 2 -name "*.zip" | while read -r zfile2; do
              unzip -o "$zfile2"
            done
          fi
          python3 - << 'EOF'
          import os
          p = "app/src/main/java/com/goatmusic/app/player/GoatNotificationBridge.kt"
          if os.path.exists(p):
              with open(p, "r", encoding="utf-8") as f:
                  c = f.read()
              c = c.replace("mediaSession = this", "GoatNotificationBridge.mediaSession = this")
              c = c.replace("GoatNotificationBridge.GoatNotificationBridge.", "GoatNotificationBridge.")
              with open(p, "w", encoding="utf-8") as f:
                  f.write(c)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK File
        run: cp app/build/outputs/apk/debug/app-debug.apk GoatMusic-v4.0.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoatMusic-APK
          path: GoatMusic-v4.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "Goat Music APK v4.0 (#${{ github.run_number }})"
          files: GoatMusic-v4.0.apk
